[package]
name = "wppr"
version.workspace = true
edition.workspace = true

[dependencies]
awww = { path = "../awww" }
matugen = { path = "../matugen" }

anyhow.workspace = true

chrono = { version = "0.4.44", default-features = false, features = [
  "clock",
  "std"
] }
clap = { version = "4.6.1", features = ["derive"] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
home = "0.5.12"
ratatui = { version = "0.30.0", default-features = false, features = [
  "crossterm"
] }
ratatui-image = { version = "10.0.7", default-features = false, features = [
  "crossterm"
] }
regex = "1.12.3"
reqwest = { version = "0.13.3", default-features = false, features = [
  "json",
  "rustls"
] }
scraper = "0.26.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1.52.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time"
] }
image = "0.25.10"
rayon = { version = "1.12.0", default-features = false }
